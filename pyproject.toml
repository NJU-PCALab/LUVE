[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luve-video"
version = "0.3.0"
description = "LUVE 2K and direct 4K video generation with an integrated FFT frequency model"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.6.0",
  "einops==0.8.0",
  "numpy==1.26.4",
  "Pillow==10.4.0",
  "safetensors==0.4.5",
  "transformers==4.46.2",
  "tokenizers==0.20.3",
  "sentencepiece==0.2.0",
  "ftfy==6.2.0",
  "packaging==24.1",
  "regex==2024.9.11",
  "PyYAML==6.0.2",
  "imageio==2.34.1",
  "imageio-ffmpeg==0.4.9",
  "tqdm==4.66.4",
  "typing_extensions==4.12.2",
]

[project.scripts]
luve-generate = "luve.cli:main"

[tool.setuptools]
include-package-data = true
license-files = [
  "third_party/**/LICENSE*", "third_party/**/NOTICE*",
  "third_party/**/MODIFICATIONS.md",
]
package-dir = {"" = "src", "luve_diffsynth" = "third_party/diffsynth/luve_diffsynth"}

[tool.setuptools.packages.find]
where = ["src", "third_party/diffsynth"]
include = ["luve", "luve.*", "luve_diffsynth", "luve_diffsynth.*"]
namespaces = false

[tool.setuptools.package-data]
luve_diffsynth = ["**/*.yaml", "**/*.json", "**/LICENSE*", "**/NOTICE*"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"third_party/**" = ["ALL"]
